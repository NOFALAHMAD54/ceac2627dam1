<title>GameZone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky glass top bar, wide spotlight carousel, then card rails and grids; app views swap inside one main container. */
:root{
  color-scheme: dark;
  --bg:#080a10; --bg-2:#0d1019; --surface:#121624; --surface-2:#191f31; --surface-3:#222a42;
  --line:rgba(150,170,225,.10); --line-2:rgba(150,170,225,.20);
  --fg:#edf0f8; --fg-2:#b8bfd3; --muted:#7c859d;
  --accent:#4f8cff; --accent-2:#86adff; --accent-ink:#050b18;
  --heart:#ff4d7d; --gold:#ffc14d;
  --st-want:#6aa4ff; --st-play:#ffab3d; --st-done:#34d399;
  --shadow:0 20px 50px -20px rgba(0,0,0,.8);
  --f-display:"Chakra Petch","Arial Narrow",Arial,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-sm:8px; --r:14px; --r-lg:22px;
  --gutter:clamp(16px,4vw,44px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 12% -10%,rgba(79,140,255,.16),transparent 60%),radial-gradient(700px 500px at 100% 0%,rgba(255,77,125,.08),transparent 60%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding-inline:var(--gutter)}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(8,10,16,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:28px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;white-space:nowrap}
.logo-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#9b6bff 55%,var(--heart));box-shadow:0 6px 20px -6px rgba(79,140,255,.7)}
.logo-mark svg{width:20px;height:20px;color:#fff}
.logo b{color:var(--accent-2);font-weight:700}
.nav{display:flex;gap:4px;flex:1}
.nav-btn{position:relative;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;color:var(--fg-2);font-weight:600;font-size:14.5px;transition:color .2s,background .2s}
.nav-btn svg{width:18px;height:18px;opacity:.8}
.nav-btn:hover{color:var(--fg);background:rgba(255,255,255,.05)}
.nav-btn.active{color:var(--fg);background:rgba(79,140,255,.14)}
.nav-btn.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-15px;height:2px;border-radius:2px;background:var(--accent)}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface-3);font-size:11.5px;font-family:var(--f-mono);display:inline-grid;place-items:center;color:var(--fg)}
.nav-btn.active .count{background:var(--accent);color:var(--accent-ink)}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);transition:background .2s,border-color .2s,transform .2s}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line-2)}
.icon-btn svg{width:19px;height:19px}
.mini-avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;background:linear-gradient(135deg,#ff8a4c,#ff4d7d 50%,#7a5cff);color:#fff;border:2px solid rgba(255,255,255,.12)}

/* Mobile tab bar */
.tabbar{display:none}
@media (max-width:900px){
  .nav{display:none}
  .topbar .wrap{justify-content:space-between}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(10,12,20,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button.active{color:var(--accent-2)}
  .tabbar .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--heart);color:#fff;font-size:10px;font-family:var(--f-mono);display:grid;place-items:center;padding:0 4px}
  main{padding-bottom:84px}
}

/* ---------- Generic ---------- */
main{position:relative;z-index:1;min-height:70vh}
.view{animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:.25;transform:translateY(10px)}to{opacity:1;transform:none}}
.section{margin-top:56px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.section-head h2{font-family:var(--f-display);font-size:clamp(22px,2.4vw,28px);font-weight:700;letter-spacing:.01em}
.section-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2)}
.link-btn{display:inline-flex;align-items:center;gap:6px;color:var(--fg-2);font-weight:600;font-size:14px;padding:8px 12px;border-radius:10px;transition:.2s}
.link-btn:hover{color:var(--fg);background:rgba(255,255,255,.05)}
.link-btn svg{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:12px;font-weight:700;font-size:14.5px;white-space:nowrap;transition:transform .18s var(--ease),background .2s,box-shadow .2s,border-color .2s,color .2s}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 30px -10px rgba(79,140,255,.8)}
.btn-primary:hover{background:var(--accent-2)}
.btn-ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:var(--fg);backdrop-filter:blur(8px)}
.btn-ghost:hover{background:rgba(255,255,255,.13)}
.btn-ghost.on-fav{background:rgba(255,77,125,.16);border-color:rgba(255,77,125,.5);color:#ffd0dc}
.btn-ghost.on-lib{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.45);color:#c9f5e3}
.btn-sm{height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--fg-2);white-space:nowrap}
.plat{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.07);color:var(--fg-2);border:1px solid var(--line)}
.rating{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-weight:700;color:var(--gold)}
.rating svg{width:14px;height:14px}
.muted{color:var(--muted)}

/* ---------- Hero search ---------- */
.hero-search{padding-top:44px;display:grid;gap:18px}
.hero-search h1{font-family:var(--f-display);font-size:clamp(30px,4.4vw,54px);font-weight:700;line-height:1.02;letter-spacing:-.01em;max-width:16ch}
.hero-search h1 span{background:linear-gradient(90deg,var(--accent-2),#c08bff 60%,var(--heart));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{position:relative;max-width:760px}
.search-box{display:flex;align-items:center;gap:12px;height:64px;padding:0 10px 0 22px;border-radius:18px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.search-box:focus-within{border-color:rgba(79,140,255,.7);box-shadow:0 0 0 4px rgba(79,140,255,.16),var(--shadow)}
.search-box > svg{width:22px;height:22px;color:var(--muted);flex:none}
.search-box input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:17px}
.search-box input::placeholder{color:var(--muted)}
.search-box .btn{height:46px}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:2px 7px}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.9);padding:8px;animation:pop .18s var(--ease)}
@keyframes pop{from{opacity:.4;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sg-item{display:flex;align-items:center;gap:14px;width:100%;padding:8px;border-radius:10px;text-align:left}
.sg-item:hover,.sg-item.hl{background:var(--surface-2)}
.sg-item img{width:40px;height:53px;border-radius:6px;object-fit:cover}
.sg-item .t{font-weight:700}
.sg-item .s{font-size:12.5px;color:var(--muted)}
.sg-item .rating{margin-left:auto;font-size:13px}
.sg-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 8px 4px;border-top:1px solid var(--line);margin-top:6px;font-size:13px;color:var(--muted)}
.sg-empty{padding:18px 10px;color:var(--muted)}
mark{background:rgba(79,140,255,.28);color:var(--fg);border-radius:3px;padding:0 1px}
.quick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.quick .lbl{font-size:13px;color:var(--muted);margin-right:4px}
.quick button{transition:.2s}
.quick button:hover{background:rgba(79,140,255,.16);border-color:rgba(79,140,255,.45);color:var(--fg)}

/* ---------- Spotlight carousel ---------- */
.spot-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-top:22px}
.spot{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/8.2;max-width:100%;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s var(--ease),visibility .8s}
.slide.active{opacity:1;visibility:visible}
.slide > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 7.5s linear}
.slide.active > img{transform:scale(1)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,8,14,.92) 0%,rgba(6,8,14,.55) 45%,rgba(6,8,14,0) 75%),linear-gradient(0deg,rgba(6,8,14,.8),transparent 45%)}
.slide-body{position:absolute;z-index:2;left:clamp(20px,4vw,48px);bottom:clamp(20px,4vw,44px);right:20px;max-width:540px;display:grid;gap:14px}
.slide-body h3{font-family:var(--f-display);font-size:clamp(28px,4vw,52px);line-height:1;font-weight:700;letter-spacing:-.01em}
.slide-body p{margin:0;color:var(--fg-2);max-width:48ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.slide-actions{display:flex;gap:10px;flex-wrap:wrap}
.slide.active .slide-body > *{animation:rise .7s var(--ease) both}
.slide.active .slide-body > *:nth-child(2){animation-delay:.06s}
.slide.active .slide-body > *:nth-child(3){animation-delay:.12s}
.slide.active .slide-body > *:nth-child(4){animation-delay:.18s}
.slide.active .slide-body > *:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:.2;transform:translateY(14px)}to{opacity:1;transform:none}}
.spot-list{display:grid;gap:8px;align-content:start}
.spot-thumb{position:relative;display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;text-align:left;overflow:hidden;transition:background .25s;border:1px solid transparent}
.spot-thumb:hover{background:var(--surface)}
.spot-thumb.active{background:var(--surface-2);border-color:var(--line-2)}
.spot-thumb img{width:48px;height:64px;border-radius:8px;object-fit:cover;flex:none;transition:transform .3s var(--ease)}
.spot-thumb:hover img{transform:scale(1.05)}
.spot-thumb .t{font-weight:700;font-size:14px;line-height:1.25}
.spot-thumb .s{font-size:12px;color:var(--muted)}
.spot-thumb .bar{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--accent)}
.spot-thumb.active .bar{animation:bar var(--dur,7s) linear forwards}
.spot-wrap.paused .spot-thumb.active .bar{animation-play-state:paused}
@keyframes bar{to{width:100%}}
@media (max-width:1100px){
  .spot-wrap{grid-template-columns:1fr}
  .spot{aspect-ratio:16/10}
  .spot-list{grid-template-columns:repeat(5,minmax(0,1fr))}
  .spot-thumb{flex-direction:column;align-items:stretch;padding:6px;gap:6px}
  .spot-thumb img{width:100%;height:auto;aspect-ratio:3/4}
  .spot-thumb .s{display:none}
  .spot-thumb .t{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@media (max-width:620px){
  .spot{aspect-ratio:4/5}
  .slide::after{background:linear-gradient(0deg,rgba(6,8,14,.96) 10%,rgba(6,8,14,.4) 60%,rgba(6,8,14,.1))}
  .spot-thumb .t{display:none}
  .slide-body p{-webkit-line-clamp:3}
}

/* ---------- Cards ---------- */
.grid{display:grid;gap:22px 18px;grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1250px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:820px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}}
.card{position:relative;cursor:pointer;outline:none;transition:transform .35s var(--ease)}
.card-media{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--surface-2);border:1px solid var(--line);transition:box-shadow .35s var(--ease),border-color .35s}
.card-media > img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease),filter .4s}
.card:hover,.card:focus-visible{transform:translateY(-6px)}
.card:hover .card-media,.card:focus-visible .card-media{border-color:color-mix(in srgb,var(--gc,#4f8cff) 60%,transparent);box-shadow:0 22px 44px -16px color-mix(in srgb,var(--gc,#4f8cff) 55%,transparent)}
.card:hover .card-media > img{transform:scale(1.08);filter:brightness(.55) saturate(1.1)}
.rank{position:absolute;top:10px;left:10px;z-index:2;font-family:var(--f-display);font-weight:700;font-size:13px;padding:3px 8px;border-radius:7px;background:rgba(6,8,14,.72);backdrop-filter:blur(6px)}
.score{position:absolute;top:10px;right:10px;z-index:2;font-family:var(--f-mono);font-weight:700;font-size:12.5px;padding:4px 8px;border-radius:7px;background:rgba(6,8,14,.72);backdrop-filter:blur(6px);color:var(--gold);display:flex;gap:4px;align-items:center}
.score svg{width:12px;height:12px}
.flags{position:absolute;left:10px;bottom:10px;z-index:2;display:flex;gap:6px;transition:opacity .3s}
.flag{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(6,8,14,.72);backdrop-filter:blur(6px)}
.flag svg{width:14px;height:14px}
.flag.f{color:var(--heart)}
.flag.l{color:var(--st-done)}
.card:hover .flags{opacity:0}
.overlay{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px;opacity:0;transform:translateY(12px);transition:opacity .3s var(--ease),transform .35s var(--ease)}
.card:hover .overlay,.card:focus-within .overlay{opacity:1;transform:none}
.overlay .btn{height:38px;font-size:13px;padding:0 10px;border-radius:10px}
.overlay .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.overlay .btn-ghost{background:rgba(10,12,20,.55)}
.card-body{padding:12px 2px 0;display:grid;gap:5px}
.card-body h3{font-size:15px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.card-meta .g{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plats{display:flex;gap:4px;flex-wrap:wrap}
@media (hover:none){
  .overlay{opacity:1;transform:none;background:none;padding:8px;justify-content:flex-start;align-items:flex-end}
  .overlay .btn-primary{display:none}
  .overlay .row{grid-template-columns:auto auto;margin-top:auto}
  .overlay .row .btn{width:34px;height:34px;padding:0}
  .overlay .row .btn span{display:none}
  .flags{display:none}
  .card:hover .card-media > img{filter:none;transform:none}
}

/* Rail (horizontal scroller) */
.rail-wrap{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(160px,17vw,220px);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail > *{scroll-snap-align:start}
.rail-nav{display:flex;gap:8px}

/* Wide release cards */
.wide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:1000px){.wide-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.wide-grid{grid-template-columns:1fr}}
.wcard{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/9;max-width:100%;cursor:pointer;border:1px solid var(--line);background:var(--surface);transition:transform .35s var(--ease),box-shadow .35s}
.wcard > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.wcard::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,8,14,.95) 5%,rgba(6,8,14,.2) 60%,transparent)}
.wcard:hover{transform:translateY(-5px);box-shadow:0 24px 50px -20px color-mix(in srgb,var(--gc) 60%,transparent)}
.wcard:hover > img{transform:scale(1.07)}
.wcard .date{position:absolute;top:14px;left:14px;z-index:2;display:grid;text-align:center;padding:6px 10px;border-radius:10px;background:rgba(6,8,14,.75);backdrop-filter:blur(6px);font-family:var(--f-mono);line-height:1.1}
.wcard .date b{font-size:18px}
.wcard .date span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2)}
.wcard .wbody{position:absolute;z-index:2;left:16px;right:16px;bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.wcard h3{font-family:var(--f-display);font-size:20px;line-height:1.1}
.wcard .wbody .s{font-size:13px;color:var(--fg-2);margin-top:4px}
.wcard .wacts{display:flex;gap:6px;opacity:0;transform:translateY(8px);transition:.3s var(--ease)}
.wcard:hover .wacts,.wcard:focus-within .wacts{opacity:1;transform:none}
@media (hover:none){.wcard .wacts{opacity:1;transform:none}}
.round{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(10,12,20,.6);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);transition:.2s}
.round svg{width:17px;height:17px}
.round:hover{background:rgba(255,255,255,.16)}
.round.on-fav{color:var(--heart);border-color:rgba(255,77,125,.6)}
.round.on-lib{color:var(--st-done);border-color:rgba(52,211,153,.6)}

/* ---------- Detail ---------- */
.detail-hero{position:relative;height:min(62vh,560px);min-height:380px;overflow:hidden}
.detail-hero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:slowzoom 18s ease-out both}
@keyframes slowzoom{from{transform:scale(1.12)}to{transform:scale(1)}}
.detail-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 2%,rgba(8,10,16,.55) 45%,rgba(8,10,16,.2)),linear-gradient(90deg,rgba(8,10,16,.7),transparent 60%)}
.back{position:absolute;z-index:3;top:22px;left:var(--gutter)}

      c.fillStyle='#140304';c.fillRect(0,hz-u*.62,w,u*.05);c.beginPath();c.moveTo(w*.02,hz-u*.62);c.lineTo(w*.5,hz-u*.85);c.lineTo(w*.98,hz-u*.62);c.fill();

      for(let i=0;i<5;i++){const x=w*(.1+i*.2),y=hz;glow(c,x,y,u*.12,'rgba(255,140,40,.8)');c.fillStyle='rgba(255,200,90,.9)';c.beginPath();c.moveTo(x-u*.02,y);c.quadraticCurveTo(x,y-u*.08,x+u*.02,y);c.fill()}
      particles(c,w,h,90,r,'#ffab52',u*.003,{glow:1,y1:hz});vignette(c,w,h,.6)}

  function draw(g,w,h,v){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');const r=rng(hash(g.id)+v*7919);(S[g.scene]||S.gta)(c,w,h,r,v);return {cv,c}}

const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s,el=document) => el.querySelector(s);
const $$ = (s,el=document) => [...el.querySelectorAll(s)];
const parseD = s => {const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtDate = s => parseD(s).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});
const year = g => +g.date.slice(0,4);
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'ahora';if(s<3600)return`hace ${Math.floor(s/60)} min`;if(s<86400)return`hace ${Math.floor(s/3600)} h`;const d=Math.floor(s/86400);if(d<30)return`hace ${d} ${d===1?'día':'días'}`;const m=Math.floor(d/30);return`hace ${m} ${m===1?'mes':'meses'}`}
function starRow(rating){const n=rating/2;let out='';for(let i=1;i<=5;i++){const fill=Math.max(0,Math.min(1,n-i+1));out+=`<span style="position:relative;display:inline-block;width:18px;height:18px;color:rgba(255,255,255,.15)">${I.star}<span style="position:absolute;inset:0;width:${fill*100}%;overflow:hidden;color:var(--gold)">${I.star}</span></span>`}return`<span class="stars">${out}</span>`}
function matchScore(g,q){const n=norm(q).trim();if(!n)return 1;const hay=norm(g.name+' '+g.genres.join(' ')+' '+g.dev+' '+g.pub+' '+g.tags);const terms=n.split(/\s+/);if(!terms.every(t=>hay.includes(t)))return 0;return norm(g.name).startsWith(n)?3:norm(g.name).includes(n)?2:1}
function hl(text,q){const n=norm(q).trim();if(!n)return esc(text);const i=norm(text).indexOf(n);if(i<0)return esc(text);return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+n.length))+'</mark>'+esc(text.slice(i+n.length))}

        <div class="f-group"><h4>Ordenar por</h4><select class="select" id="f-sort" aria-label="Ordenar por">${[['pop','Popularidad'],['rating','Mejor valorados'],['new','Más recientes'],['old','Más antiguos'],['az','Nombre (A–Z)']].map(([k,l])=>`<option value="${k}" ${F.sort===k?'selected':''}>${l}</option>`).join('')}</select></div>
        <button class="btn btn-ghost btn-sm" data-action="f-clear">${I.x}Limpiar filtros</button>
      </aside>
      <div id="results" style="min-width:0"></div>
    </div>
  </div>`;
}
function filtered(){
  let list=GAMES.map(g=>({g,s:matchScore(g,F.q)})).filter(x=>x.s).map(x=>x.g);
  if(F.genres.size)list=list.filter(g=>[...F.genres].every(x=>g.genres.includes(x)));
  if(F.plats.size)list=list.filter(g=>[...F.plats].some(p=>g.plats.includes(p)));
  if(F.min)list=list.filter(g=>g.rating>=F.min);
  const era=ERAS.find(e=>e.k===F.era);if(era&&era.k!=='all')list=list.filter(g=>year(g)>=era.a&&year(g)<=era.b);
  const cmp={pop:(a,b)=>b.pop-a.pop,rating:(a,b)=>b.rating-a.rating,new:(a,b)=>b.date.localeCompare(a.date),old:(a,b)=>a.date.localeCompare(b.date),az:(a,b)=>a.name.localeCompare(b.name,'es')}[F.sort];
  if(F.q&&F.sort==='pop')list.sort((a,b)=>matchScore(b,F.q)-matchScore(a,F.q)||cmp(a,b));else list.sort(cmp);
  return list;
}
function renderResults(){
  const box=$('#results');if(!box)return;const list=filtered();
  const pills=[];if(F.q)pills.push(['q','',`«${F.q}»`]);F.genres.forEach(g=>pills.push(['genre',g,g]));F.plats.forEach(p=>pills.push(['plat',p,p]));if(F.min)pills.push(['min','',`★ ${F.min.toFixed(1)}+`]);if(F.era!=='all')pills.push(['era','',ERAS.find(e=>e.k===F.era).l]);
  box.innerHTML=`<div class="results-bar"><div><span class="n">${list.length}</span> <span class="muted">${list.length===1?'juego encontrado':'juegos encontrados'}</span></div>
    <div class="active-f">${pills.map(([k,v,l])=>`<button data-action="f-pill" data-k="${k}" data-v="${esc(v)}" aria-label="Quitar filtro ${esc(l)}">${esc(l)}${I.x}</button>`).join('')}</div></div>
    ${list.length?`<div class="grid">${list.map(g=>card(g)).join('')}</div>`:empty(I.search,'Sin resultados',`No hay juegos que cumplan estos filtros${F.q?` para «${esc(F.q)}»`:''}. Prueba a quitar algún filtro.`,`<button class="btn btn-primary btn-sm" data-action="f-clear">Limpiar filtros</button>`)}`;
}

function syncButtons(id){
  const f=isFav(id),l=inLib(id);
  $$(`[data-action="fav"][data-id="${id}"]`).forEach(b=>{if(b.closest('#detail-actions'))return;b.classList.toggle('on-fav',f);const sp=b.querySelector('span');b.innerHTML=(f?I.heartF:I.heart)+(sp?`<span>${favBtnLabel(id)}</span>`:'')});
  $$(`[data-action="lib"][data-id="${id}"]`).forEach(b=>{if(b.closest('#detail-actions'))return;b.classList.toggle('on-lib',l);const sp=b.querySelector('span');b.innerHTML=(l?I.check:I.plus)+(sp?`<span>${libBtnLabel(id)}</span>`:'')});
  $$(`.card[data-id="${id}"] .flags`).forEach(fl=>{fl.innerHTML=`${f?`<span class="flag f">${I.heartF}</span>`:''}${l?`<span class="flag l">${I.check}</span>`:''}`});
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el){if(!e.target.closest('#home-search-wrap')){const s=$('#suggest');if(s)s.innerHTML=''}return}
  const a=el.dataset.action,id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case 'route':go(el.dataset.route);break;
    case 'open':go('juego-'+id);break;
    case 'fav':e.stopPropagation();toggleFav(id);break;
    case 'lib':e.stopPropagation();toggleLib(id);break;
    case 'remove':removeLib(id);break;
    case 'status':setStatus(id,el.dataset.st);break;
    case 'back':history.length>1?history.back():go('inicio');break;
    case 'spot':spotTo(+el.dataset.i);startSpot();break;
    case 'rail':{const r=$('#'+el.dataset.rail);if(r)r.scrollBy({left:+el.dataset.dir*r.clientWidth*.85,behavior:'smooth'});break}
    case 'genre-go':F.q='';F.genres=new Set([v]);F.plats.clear();F.min=0;F.era='all';markFilters();go('explorar');break;
    case 'explore-sort':F.q='';F.genres.clear();F.plats.clear();F.min=0;F.era='all';F.sort=v;go('explorar');break;
    case 'search-all':searchAll($('#home-search')?.value||'');break;
    case 'focus-search':if(current()==='inicio'){const i=$('#home-search');window.scrollTo({top:0,behavior:'smooth'});i?.focus()}else if(current()==='explorar'){$('#explore-q')?.focus()}else{F.focus=true;go('explorar')}break;
    case 'toggle-filters':$('#filters').classList.toggle('open');break;
    case 'f-genre':F.genres.has(v)?F.genres.delete(v):F.genres.add(v);el.classList.toggle('on');el.setAttribute('aria-pressed',F.genres.has(v));markFilters();renderResults();break;
    case 'f-plat':F.plats.has(v)?F.plats.delete(v):F.plats.add(v);el.classList.toggle('on');el.setAttribute('aria-pressed',F.plats.has(v));markFilters();renderResults();break;
    case 'f-era':F.era=v;$$('[data-action="f-era"]').forEach(b=>{b.classList.toggle('on',b.dataset.v===v);b.setAttribute('aria-pressed',b.dataset.v===v)});markFilters();renderResults();break;
    case 'f-clear':F.q='';F.genres.clear();F.plats.clear();F.min=0;F.era='all';F.sort='pop';rerender();break;
    case 'f-pill':{const k=el.dataset.k;if(k==='q')F.q='';if(k==='genre')F.genres.delete(v);if(k==='plat')F.plats.delete(v);if(k==='min')F.min=0;if(k==='era')F.era='all';rerender();break}
    case 'lib-tab':libTab=v;rerender();break;
    case 'shot':openLightbox(id,+el.dataset.i);break;
    case 'edit-name':editingName=true;rerender();break;
    case 'cancel-name':editingName=false;rerender();break;
    case 'reset-ask':confirmReset=true;rerender();break;
    case 'reset-cancel':confirmReset=false;rerender();break;
    case 'reset-empty':S={...DEFAULT(),fav:[],lib:{},act:[],demo:false};confirmReset=false;save();rerender();toast('Datos vaciados. Empieza tu colección desde cero.',{icon:I.check,color:'var(--st-done)'});break;
    case 'reset-demo':S=DEFAULT();confirmReset=false;save();rerender();toast('Datos de ejemplo restaurados',{icon:I.undo,color:'var(--accent)'});break;
  }
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card,.wcard')){e.preventDefault();go('juego-'+e.target.dataset.id)}
  if(e.key==='/'&&!e.target.matches('input,textarea,select')){e.preventDefault();$('[data-action="focus-search"]').click()}
});

/* ================= TOAST ================= */
function toast(msg,o={}){
  const box=$('#toasts'),t=document.createElement('div');t.className='toast';
  const lead=o.img?`<img src="${Art.cover(o.img)}" alt="">`:`<span class="ti" style="background:color-mix(in srgb,${o.color||'var(--accent)'} 20%,transparent);color:${o.color||'var(--accent)'}">${o.icon||I.check}</span>`;
  const btn=o.undo?['Deshacer',o.undo]:o.action;
  t.innerHTML=`${lead}<span>${esc(msg)}</span>${btn?`<button>${esc(btn[0])}</button>`:''}`;
  if(btn)t.querySelector('button').addEventListener('click',()=>{btn[1]();close()});
  box.appendChild(t);while(box.children.length>3)box.firstChild.remove();
  let gone=false;function close(){if(gone)return;gone=true;t.classList.add('out');setTimeout(()=>t.remove(),300)}
  setTimeout(close,o.undo?5000:3200);
}

/* ================= LIGHTBOX ================= */
let lb=null;
function openLightbox(id,i){lb={id,i};drawLb()}
function drawLb(){const root=$('#lightbox-root');if(!lb){root.innerHTML='';return}const g=BY_ID[lb.id];
  root.innerHTML=`<div class="lightbox" data-lb="bg" role="dialog" aria-label="Captura de ${esc(g.name)}"><img src="${Art.shot(g.id,lb.i)}" alt="Captura ${lb.i+1} de ${esc(g.name)}">
  <div class="lb-bar"><button class="icon-btn" data-lb="close" aria-label="Cerrar">${I.x}</button></div>
  <button class="icon-btn lb-nav l" data-lb="prev" aria-label="Anterior">${I.left}</button><button class="icon-btn lb-nav r" data-lb="next" aria-label="Siguiente">${I.right}</button>
  <div class="lb-count">${esc(g.name)} · ${lb.i+1} / 4</div></div>`}
$('#lightbox-root').addEventListener('click',e=>{const k=e.target.closest('[data-lb]')?.dataset.lb;if(!k)return;if(k==='bg'&&e.target.tagName==='IMG')return;
  if(k==='prev')lb.i=(lb.i+3)%4;else if(k==='next')lb.i=(lb.i+1)%4;else if(k==='close'||(k==='bg'&&e.target.classList.contains('lightbox')))lb=null;else return;drawLb()});
document.addEventListener('keydown',e=>{if(!lb)return;if(e.key==='Escape')lb=null;else if(e.key==='ArrowRight')lb.i=(lb.i+1)%4;else if(e.key==='ArrowLeft')lb.i=(lb.i+3)%4;else return;drawLb()});

/* ================= BOOT ================= */
(async function boot(){
  try{await Promise.race([Promise.all([document.fonts.load('700 40px "Chakra Petch"'),document.fonts.load('700 20px "JetBrains Mono"')]),new Promise(r=>setTimeout(r,1500))])}catch(e){}
  render(true);
  const sp=$('#splash');sp.style.opacity='0';setTimeout(()=>sp.remove(),400);
})();
</script>
